# GTA IV Complete Edition — Version 3 after-hours Ryzen APU profile.
# Validated against the active DXVK GPLAsync v2.6.2 path logged on a Ryzen 5 PRO 6650U / Radeon 660M.
# Keep one renderer path, restart after changes, and let a changed cache warm through repeat runs.

# The active GPLAsync path recorded in GTAIV_d3d9.log.
dxvk.gplAsyncCache = True
dxvk.enableAsync = true
dxvk.numAsyncThreads = 4

# Four compiler threads and four async workers preserve CPU space for GTA IV streaming, traffic, scripts, and Windows.
dxvk.numCompilerThreads = 4

# 32-bit GTA IV compatibility, low-latency presentation, and one-limiters-only pacing.
d3d9.maxAvailableMemory = 4096
d3d9.maxFrameLatency = 1
d3d9.maxFrameRate = 0
d3d9.presentInterval = -1

# Radeon 660M log confirmed these capabilities; Auto keeps the driver in control where it belongs.
dxvk.enableGraphicsPipelineLibrary = Auto
dxvk.allowFse = true

# Do not force device-local placement on an integrated GPU using shared system memory.
d3d9.deviceLocalConstantBuffers = False

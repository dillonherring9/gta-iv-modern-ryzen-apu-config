# GTA IV Complete Edition — OPTIONAL DXVK GPLAsync v2.6.2-1 overlay.
#
# Compatibility contract:
# - Renderer artifact: dxvk-gplasync-v2.6.2-1.tar.gz
# - Official release: https://gitlab.com/Ph42oN/dxvk-gplasync/-/releases/v2.6.2-1
# - SHA-256: c645d3f2550ff66d0a51ba27a535aaa7351fd087feb7b298e7283cb2a3ee173b
# - GTA IV path: FusionFix Vulkan route, using x32\d3d9.dll renamed to vulkan.dll.
# - Tested reference: Ryzen 5 PRO 6650U / Radeon 660M / 16 GB dual-channel memory.
#
# Do not use this file with stock/upstream DXVK or a different GPLAsync artifact.
# If GTAIV_d3d9.log reports unsupported keys, restore dxvk-stock.conf before changing any other variable.

# GPLAsync-specific keys accepted by the version-locked renderer above.
dxvk.gplAsyncCache = True
dxvk.enableAsync = true
dxvk.numAsyncThreads = 4

# Shared baseline keys.
dxvk.numCompilerThreads = 4
d3d9.maxFrameLatency = 1
d3d9.maxFrameRate = 0
d3d9.presentInterval = -1
d3d9.maxAvailableMemory = 4096
dxvk.enableGraphicsPipelineLibrary = Auto
dxvk.allowFse = true
d3d9.deviceLocalConstantBuffers = False

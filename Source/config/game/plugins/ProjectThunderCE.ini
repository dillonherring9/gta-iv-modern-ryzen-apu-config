; Project Thunder CE 1.9 -- port of Project Thunder (ItsClonkAndre, GPL-3.0) for
; GTA IV Complete Edition 1.2.0.59 + FusionFix, no IV-SDK .NET needed.
; Changes are read when the game starts. Ctrl+F7 opens the in-game menu (it saves here when it closes).

[General]
; 1 = automatic lightning during thunderstorms (LIGHTNING weather). 0 = off.
Enabled=1
; The Ctrl+F7 menu can force a storm, a close bolt, distant bolts and a blackout.
; IMPORTANT: if you forced a storm, go back to normal weather in the menu before saving the game.
; 0 = no lightning during cutscenes.
AllowLightningBoltsInCutscene=1
; Language of the Ctrl+F7 menu: 0 = English, 1 = Spanish. F1 inside the menu switches it.
MenuSpanish=0

[LightningBolt]
; Chance (%) of a bolt every 1.25 s: storm starting / at its peak / ending.
SpawnChancePercentageBeginning=6
SpawnChancePercentageOngoing=15
SpawnChancePercentageEnding=4
; Chance (%) of a branch on each segment of the bolt.
BranchSpawnChance=1.25
; Bolt length (number of points).
MinSize=35
MaxSize=500
; How fast a bolt fades out (0.1 slow ... 1.0 instant). Higher = shorter flash.
MinFadeOutSpeed=0.06
MaxFadeOutSpeed=0.25
; How long the main bolt stays on screen (flickering) before it starts to fade, in milliseconds
; (random between these two; 0 = fades as soon as it lands). Lower StayOnScreenMaxMs for a shorter flash.
; Also in the Ctrl+F7 menu as "Shortest flash" / "Longest flash".
; Distant bolts fade right away.
StayOnScreenMinMs=0
StayOnScreenMaxMs=1000
; Bolt colour (0-1 R,G,B).
ColorRGB=0.766,0.9,1.0
; Size of the coronas that make up the bolt.
CoronaSize=6000
; Height the bolt starts at (metres).
Height=500
; Max coronas per frame (the game allows 768 in total, shared with street lamps / LOD lights).
MaxCoronasPerFrame=350
; Chance (%) that a new bolt "recharges" the one already in the sky (flicker).
RestrikeChance=50
; Chance (%) that a bolt hits one of the fixed spots in Data\ScriptedLightning.json
; (towers, tall buildings) when you look that way or pass nearby.
ScriptedSpawnChance=0   ; Vice City: the scripted spots in Data\ScriptedLightning.json are Liberty City coordinates
; Chance (%) that the bolt goes for the tallest thing near you (buildings, towers, antennas).
TallTargetChance=25
; How far from you it looks (metres).
TallTargetRadius=900

[Light]
; Light the bolt casts over the city.
Enabled=1
Intensity=0.003
Range=700

[Sky]
; Lights up the clouds while a bolt is on screen. 0 = the sky doesn't light up.
LightUpClouds=1
AdditionalCloudBrightness=20.0

[Sound]
Enabled=1
; Master volume (0.0 - 1.0).
Volume=0.9
; How much quieter it is indoors.
LowerVolumeWhenInInterior=0.25
; Thunder delay = distance / SpeedOfSound * DelayMultiplier (343 = real speed of sound).
SpeedOfSound=343
DelayMultiplier=1.0
; Max delay in seconds.
MaxDelaySeconds=12
; Volume of a very distant bolt compared to a close one (1.0 = all equally loud).
DistantVolume=0.35
; Cuts the highs of distant thunder (0 = no, 1 = normal).
DistantMuffle=1.0
; Set to 1 if the thunder comes from the opposite side of the bolt.
InvertLeftRight=0
; Thunder by distance: up to CloseThunderDistance you hear sharp cracks (Thunder\Close folder),
; from FarThunderDistance the long rumbles (Thunder\Far); in between, a mix.
; Loose files in Thunder\ are used for any distance.
CloseThunderDistance=800
FarThunderDistance=1800
; Indoors thunder sounds muffled, as if through the walls (0 = no, 1 = very muffled).
InteriorMuffle=0.9

[Danger]
; Above DangerousHeight (rooftops, helicopter) a bolt may land near you.
EnableDangerousHeight=1
DangerousHeight=189
SpawnChanceWhenAboveDangerousHeight=3
; A pedestrian with an umbrella can attract a bolt (chance % per pedestrian on each bolt).
EnableUmbrellaDanger=1
SpawnChanceWhenHoldingUmbrella=0.1

[Explosion]
; Explosion where the bolt touches the ground.
CreateExplosions=1
; 2 = ROCKET (see the list below)
Type=2
Radius=15
CamShake=1
; Never explodes closer than this to the player (metres).
MinDistanceToPlayer=35
; 0 = never during a mission (recommended: doesn't break missions or achievements).
AllowDuringMissions=0

[Rumble]
; The controller rumbles with close thunder (uses the game's rumble, so with
; NativeDualSense you feel it on the DualSense). A bolt closer than 150 m also gives an instant kick.
Enabled=1
; Max bolt distance to feel it (metres).
MaxDistance=1200
; Strength (0.5 = soft, 1 = normal, 1.5 = strong).
Strength=1.0

[CarAlarms]
; Parked cars near where a bolt lands set off their alarm.
Enabled=1
Radius=45
; Chance (%) per car.
Chance=60

[Reactions]
; The player swears when the power goes out.
AllowPlayerReactions=1
; Pedestrians react to thunder (look at the bolt, say something) and to blackouts.
AllowPedReactions=1
; Chance (%) that each nearby pedestrian reacts.
ReactionChance=25

[Blackout]
; Blackouts: if a bolt lands within RangeAroundElectricalSubstation metres of an electrical
; substation (Data\ElectricalSubstations.json) the power may go out: building windows, signs,
; street lamps and distant lights go dark, the night gets darker and you hear the cut.
; Light halos (lamps, signs, windows) go off, traffic lights go dark, trains stop and
; Pay'n'Spray shops close until the power is back. Car lights stay on.
Enabled=1
; Blackout chance (%) by day / in the evening (the grid is busier at night).
ChanceDay=5.0
ChanceEvening=7.5
RangeAroundElectricalSubstation=30
; Duration in seconds (random between these two).
MinActiveFor=25
MaxActiveFor=80
; An explosion of yours (grenade, car, etc.) at a substation can also cut the power.
ExplosionsCanTrigger=1
; Also turn off street lamps, prop lights and traffic lights (not only buildings).
TurnOffStreetLamps=1
; How much darker the night gets during a blackout (0 = none, 0.9 = a lot).
AdditionalDarkness=0.3
PlayBlackoutSound=1
CanPlaySoundWhenInInterior=0
; 0 = never during a mission (recommended).
AllowDuringMissions=0

; ---- Explosion types ----
; 0 GRENADE, 1 MOLOTOV, 2 ROCKET, 3 HI_OCTANE, 4 CAR, 5 PLANE, 6 PETROL_PUMP, 7 BIKE,
; 8 DIR_STEAM, 9 DIR_FLAME, 10 DIR_WATER_HYDRANT, 11 DIR_GAS_CANISTER, 12 BOAT, 13 SHIP_DESTROY, 14 TRUCK

[Sparks]
; Sparks at an electrical substation when a bolt or an explosion hits it
; (even if the blackout roll fails).
Enabled=1
; Seconds the sparking lasts.
Duration=6
; Volume of the electric arc noise (heard up to ~220 m).
Volume=1.0
; Bluish flash on each spark.
Light=1

[RadioStatic]
; Static on the car radio when a bolt lands nearby (distant decorative bolts don't cause it).
Enabled=1
; Max bolt distance (metres).
MaxDistance=800
Volume=0.6
; 1 = only when the radio is on.
OnlyWhenRadioIsOn=1

[Water]
; Bolts that hit the river or the sea: splash, flash and hiss (no explosion).
Enabled=1
Volume=1.0

[DistantLightning]
; Extra decorative bolts during the storm: far away, never touch the ground, no explosions or blackouts.
Enabled=1
; Chance (%) every 1.25 s of a burst (12 = roughly one burst every 10 s).
Chance=12
; Max bolts per burst.
MaxAtOnce=2
; Distance in metres.
MinDistance=1500
MaxDistance=4000
; Chance (%) of cloud-to-cloud (horizontal); otherwise it goes down and dies in the air.
CloudToCloudChance=50
; 1 = you hear its distant thunder.
Thunder=1
; Heat lightning: silent flashes on the horizon on cloudy/rainy nights without a storm.
HeatLightning=1
HeatLightningChance=6

[Echo]
; Between tall buildings the thunder echoes (echo + reverb); in open places it sounds dry.
Enabled=1
; 0.5 = a little, 1 = normal, 1.5 = a lot.
Strength=1.0

[Generators]
; During a blackout, hospitals and police stations keep their lights (emergency generator).
Enabled=1
; Radius in metres around the respawn point (hospital/police station) that stays lit.
Radius=70
; Extra light at the entrance.
EntranceLights=1
; Generator noise when you're within 90 m.
Sound=1
Volume=0.8

[Dogs]
; After a loud thunder nearby, neighbourhood dogs sometimes bark (not inside buildings).
Enabled=1
; Chance (%) with a very close thunder (drops with distance).
Chance=35
; Max thunder distance (metres).
MaxThunderDistance=900
Volume=0.2

[Storms]
; The mod only acts in the game's thunderstorm weather. If you want some heavy rain to bring
; lightning too, put the percentage here (0 = heavy rain stays like the original game).
HeavyRainWithThunderChance=0

[Smoke]
; Where a bolt lands, small flames burn out on their own and then smoke for a while.
Enabled=1
MinSeconds=30
MaxSeconds=60

[StElmosFire]
; St. Elmo's fire: a flickering bluish glow on top of buildings during the storm.
Enabled=1
; Min height (metres above you) for a rooftop to count as "tall".
MinHeight=70

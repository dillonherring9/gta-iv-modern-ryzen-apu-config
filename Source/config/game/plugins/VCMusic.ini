; VCMusic - native (no .NET) port of AVCNG's music scripts
; VWantedMusic, DeathMusicIV and VFlyingMusic by ItsClonkAndre.
; Tracks: plugins\VCMusic\Wanted, \Death, \Flying (.mp3 .wav .ogg, up to 16 each).
; Priority: Death > Wanted > Flying. Pauses with the pause menu.
; Volume 0-100. FadingSpeed in milliseconds. Log: plugins\VCMusic.log

[Wanted]
Enabled=1
; wanted stars needed to start the chase music (1-6)
StartAt=3
Volume=40
FadingSpeed=6000
; when a track ends while still wanted, start another random one
PlayAnotherTrackWhenDone=1

[Death]
Enabled=1
Volume=40
FadingSpeed=3000
; also play when health is this low or lower (out of 100) while still alive
PlayWhenNearDeath=1
NearDeathHealth=10

[Flying]
Enabled=0
Volume=60
FadingSpeed=2000
; continue the track where it stopped next time you fly
ResumeWhereLeft=1

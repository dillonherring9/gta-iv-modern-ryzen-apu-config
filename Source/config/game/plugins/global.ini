; VCRender (step 256). Ultimate ASI Loader reads this file from plugins\.
; It stops the loader from auto-loading root .asi files (only DLSS-IV.asi in this build): DLSS-IV needs
; Direct3D inside the game process and cannot run with VCRender. Removing this file (UNDO.sh) restores DLSS-IV.
[globalsets]
LoadFromScriptsOnly=1

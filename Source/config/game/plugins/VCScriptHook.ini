; VCScriptHook settings: runs the DualSense mod natively
[VirtualPad]
; 1 = the DualSense works as a standard game controller (no ViGEm, DS4Windows or Steam Input needed)
Enabled=1
[Weapons]
; 0 = keep (the DualSense mod already knows the Vice City weapons)
VcWeaponIds=0
[ControllerAudio]
; The DualSense mod's own sound effects (only those, never the game's audio) on the controller.
; Speaker=1 = controller speaker on (USB and Bluetooth): police siren and near-death heartbeat, plus any Speaker<Group>=1 below
Speaker=1
; Controller speaker loudness in percent (0-100, 5 % steps; = Settings > Audio > DualSense Controller Speaker Volume)
SpeakerVolume=100
; Bluetooth=1 sends speaker sound and HD haptics over Bluetooth (no USB cable needed)
Bluetooth=1
; Bluetooth haptic strength in percent (0-400) and low-pass cutoff in Hz (100-2900)
HapticGain=100
HapticCutoff=1000
; Which DualSense mod sounds also play on the controller speaker (the haptics always get all of them).
; 1 = speaker + haptics, 0 = haptics only. SpeakerFilter=0 = old behaviour (every mod sound on the speaker).
; Default: all 0 - the speaker plays only the police siren and the near-death heartbeat.
SpeakerFilter=1
; engines, helicopters, planes, trains
SpeakerEngine=0
; tyres, skids, road surface
SpeakerRoad=0
; crashes, collisions, melee hits, falls, splashes
SpeakerImpacts=0
; gunshots, reloads
SpeakerWeapons=0
; explosions, fire
SpeakerExplosions=0
; rain, water, footsteps, ambience
SpeakerAmbient=0
SpeakerOther=0
; Police siren on the controller speaker while wanted; loudness follows the nearest police (full at 5 m, silent at SirenRange metres)
Siren=1
SirenVolume=100
SirenRange=120
; Heartbeat near death on the PC/TV and the controller speaker at the same moment (TV volume x the game SFX volume)
Heartbeat=1
HeartbeatBelowPercent=20
HeartbeatControllerVolume=100
HeartbeatTvVolume=70
[Lightbar]
; Light bar: health 100 % green -> 50 % yellow -> 1 % red; police double-flash red/blue while wanted
HealthColours=1
PoliceFlash=1

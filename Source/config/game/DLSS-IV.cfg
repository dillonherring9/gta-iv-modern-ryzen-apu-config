# ============================================================================
#  DLSS-IV

#  REQUIRES DXVK and FusionFix
# ============================================================================


# ============================================================================
#  1.  ANTI-ALIASING AND UPSCALING
# ============================================================================

# quality  -  The render size, as a preset: how much of the screen the game
# renders before the upscaler brings it back to full size.
#
#   0  DLAA          full resolution, best image, no upscaling
#   1  Quality       renders at two thirds         (2560x1440 at 4K)   (default)
#   2  Balanced      renders at 0.58               (2227x1253 at 4K)
#   3  Performance   renders at a half             (1920x1080 at 4K)
#   4  Ultra Perf    renders at a third            (1280x720 at 4K)
#
# GTA IV is held back far more by your processor than your graphics card, so
# the lower modes give back much less here than in a modern game.
#
# Quality is the default: measured on a graphics card that was the limit, it
# cost about 2 percent of the frame rate against the game without the mod,
# where DLAA cost about 28 percent (38 with HDR on). Pick DLAA if your card
# has frame rate to spare. There is no good reason to go below Quality in
# this game if you are on a modern graphics card.
quality=1

# custom  -  A custom render size instead of the preset above
# a percent of the screen, overrides quality
# valid values:  34 to 99
# 0 disables the custom quality feature
# Needs a restart.
custom=0

# responsiveness  -  Faster input response
#
# The mod has three techniques to cut input delay:
#
#   Frame queue: stops the game from preparing frames ahead of your graphics
#   card, so your input is not waiting behind old frames. Cheap and safe.
#
#   Pacer: starts each frame only when the graphics card is about to be ready
#   for it, so your input is read later and shows up sooner. Helps most when
#   your GPU is maxed out (near 100 percent usage).
#
#   Same-frame upscale: upscales the frame you are on instead of the previous
#   one, which removes a frame of delay. Free if you play with a frame limiter
#   or vsync, but it can cost frame rate if you don't.
#
# Which to pick:
#
#   4  the default, best for most people. The frame queue always, plus the
#      other two only where the mod measures them as free while you play.
#
#   3  all three, wherever they apply. Under FusionFix's FPS limiter or vsync
#      the pacer stands down by itself, so there 3 and 4 do the same thing:
#      the default 4 already turns the same-frame upscale on.
#
#   2  frame queue and pacer. For a PC that is always GPU-limited without a
#      frame cap.
#
#   1  frame queue only. The safest choice if anything feels uneven.
#
#   0  off, for comparison.
#
# Needs a restart.
responsiveness=4

# upscaler  -  Which technology handles Anti-Aliasing/upscale
#
#  -1  automatic (default).
#   0  DLSS   NVIDIA RTX only (the 20 series or newer)
#   1  FSR    AMD FidelityFX Super Resolution. Works on any graphics card
#
# Automatic will detect if your graphics card can use DLSS, if it can't
# it will use FSR. Radeon RX 7000 and 9000 cards get FSR 4 automatically,
# see fsr_version below.
upscaler=-1

# sharpness  -  RCAS sharpening after the resolve, off by default
#
# 0 is the default: the mod adds no sharpening of its own.
#
# 0.5 is AMD's own default strength and a good place to start.
# Turning it on from 0 needs a relaunch
# Value range: 0 - 1.0
# TURN OFF YOUR DRIVER'S SHARPENING FIRST or the two can stack.
# In the NVIDIA app that is Image Scaling,
# same for any Sharpen filter in Freestyle or ReShade.
sharpness=0

# preset  -  which DLSS model NVIDIA uses. Ignored by FSR.
#
#   11  K  the default, best for DLAA and Quality mode
#   13  M  NVIDIA's default for Performance mode
#   12  L  NVIDIA's default for Ultra Performance mode
#   10  J  close to K; but K is recommended instead
#    0      let the driver decide, which changes with driver updates
#
# Leave this alone unless you have a reason. M and L cost more performance
# and use FP8 maths that only RTX 40 and 50 cards have in hardware,
# it will run worse on other cards. The NVIDIA app setting will overwrite this,
# but it has to be set on dlssiv-helper.exe
preset=11

# fsr_version  -  which FSR version runs. Ignored by DLSS.
#
#   0  automatic (default): the newest FSR your graphics card supports
#   4  FSR 4    AMD Radeon RX 7000 and 9000 series
#   3  FSR 3.1  any graphics card
#
# Automatic gives FSR 4 on cards that support it and FSR 3.1 on
# everything else. Set 3 if you prefer FSR 3.1, which could be lighter to run.
# Setting 4 on a card without FSR 4 gives you FSR 3.1 instead.
#
# Unofficial community FSR 4 builds for other cards are linked on
# the mod page. Use them at your own risk.
fsr_version=0


# ============================================================================
#  2.  HDR OUTPUT
# ============================================================================

# hdr  -  off by default
#
# 1 turns it on. You need Windows HDR switched on BEFORE the game starts, and the game
# set to BORDERLESS in its graphics options. If you pick Fullscreen while HDR
# is running, the mod keeps the window borderless and HDR stays on. A game
# STARTED in Fullscreen runs without HDR until you switch it to Borderless.
#
# Do this once: run the Windows HDR Calibration app from the Microsoft Store.
# The peak below is read from what it writes. Use HGIG on the TV if it has it,
# and turn RTX HDR and Auto HDR off for this game.
#
# On Linux (Proton): on a Steam Deck, play in Game Mode with HDR switched on
# in its display settings; no launch options are needed for HDR. On a desktop,
# add DXVK_HDR=1 to the game's launch options and run it either in gamescope
# with --hdr-enabled, or through Wine's Wayland driver in an HDR session
# (PROTON_ENABLE_WAYLAND=1, Mesa 25.1 or newer). X11 and XWayland cannot show
# HDR. Fullscreen is fine on Linux.
hdr=0

# hdr_peak  -  how bright your display can actually go, in nits
# 0 uses what Windows reports, which is what the calibration app is for
# Only set a number if you know your panel's 10% peak differs from that.
hdr_peak=0

# hdr_paper_white  -  what plain white becomes, in nits
#
# This is the HUD, the menus, and a white wall in daylight.
#
# 203 IS THE HDR REFERENCE WHITE (ITU-R BT.2408) for a 1000 nit panel.
#
# Try 0 if 203 looks wrong on your panel; anything from about 160 to 240 is
# reasonable, this is a taste setting
hdr_paper_white=203

# hdr_ui  -  brightness of the interface, in nits
# 0 uses the paper white setting
hdr_ui=0

# hdr_rolloff  -  how the very brightest highlights are handled
# A percentage of your display's headroom. Above it, highlights bend gently
# towards your peak instead of clipping flat; everything below it is sent at
# its true brightness. 80 is the default. 50 is softer and dimmer at the top.
# 0 clips hard at the peak.
# Recommend leaving it at 80 unless you notice a lot of pure bright clipping
hdr_rolloff=80


# cfg_live  -  Allows changes to the HDR brightness settings above and to
# sharpness while the game is running (hdr itself needs a relaunch)
#
# OFF by default.
#
#cfg_live=1


# ============================================================================
#  3.  PERFORMANCE
# ============================================================================

# These three are designed to make the game run faster and are all ON by
# default.
#
# If the game stutters or runs badly on your setup, turn them off one at a
# time: change a 1 to a 0, restart the game, and see if it helped.
# Each of them needs a restart.

# threaded  -  Runs the game's Direct3D work on a thread of its own. This is
# the mod's largest performance gain.
threaded=1

# unpin  -  GTA IV ties its main thread to your first processor core. This
# frees it, which raises the frame rate when your processor is what limits
# it. On a Ryzen with two core groups (a 5900X or 7950X, for example) it also
# keeps the game on one of them. Setting this to 0 turns cpu_place off as
# well.
unpin=1

# cpu_place  -  Gives each of the game's busiest threads a processor thread of
# its own, which raises the frame rate further when your processor is what
# limits it.
cpu_place=1

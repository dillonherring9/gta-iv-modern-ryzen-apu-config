; VCRender (steps 256-264): the game's Direct3D 9 renderer runs in a separate 64-bit process,
; plugins\VCRender\VCRenderHost.exe, so the graphics driver no longer uses the game's 32-bit address space.
; Remove plugins\VCRender.asi, this file, plugins\global.ini and the plugins\VCRender folder to go back
; (undo steps 264 back to 256 in reverse order; each step's UNDO.sh does exactly that).
[VCRender]
; 1 = on, 0 = off (the game then uses its normal in-process renderer; DLSS-IV stays off while global.ini exists)
Enabled=1
; Exclusive fullscreen requests: 0 = borderless window over the monitor, picture scaled to fit (default)
;                                 1 = change the display mode as DXVK does
FullscreenMode=0
; How many frames the game may run ahead of the picture on screen (1-3). 1 = lowest input latency while keeping the CPU
; and GPU working in parallel (step 261; measured 88 ms median Present-to-screen at 20 fps, against 134 ms with 2).
; Raise it only if the frame rate matters more than latency.
MaxFramesAhead=1
; Shared memory taken from the game's address space, in MiB
RingMB=16
ArenaMB=48
ResponseMB=8
; Seconds between [address] and [streaming] lines in plugins\VCRender.log (0 = off)
AddressLogSeconds=30

[Streaming]
; Step 258: more texture memory for GTA IV's streaming, used only while VCRender is the renderer.
; Raises the engine's texture-memory limit by this many MiB (0-1024, 0 = the game's own budget).
; The streaming budget shown in the pause menu grows by about 90% of it (the engine's own 0.9 factor);
; at High texture quality that is about 1,070 -> 1,530 MiB with 512.
ExtraTextureMiB=512
; Safety: the extra switches off while the game's 32-bit address space has less than LowAddressMiB unmapped
; or no free gap of LowGapMiB, and back on once there is 256 MiB (gap 128 MiB) more. Logged in VCRender.log.
LowAddressMiB=600
LowGapMiB=200
; Step 263: record the engine's failed resource loads in VCRender.log ("[streaming] LOAD FAILED" lines: which resource,
; its size, how full the streaming heaps were) and add load and eviction counts to the periodic [streaming] line.
; Loading itself is unchanged. 1 = on (default), 0 = off
Diagnostics=1
; Step 264: GTA IV places every resource's texture/vertex data in its fixed 160 MiB resource heap, which only hands out
; power-of-two blocks. A texture set over 16 MiB (northbuild.wtd 31.5 MiB, police.wtd 25 MiB) needs a completely free
; 32 MiB block; when none is left, the engine empties the world and retries forever. With PhysicalPool=1, blocks above
; PoolLargeMiB, and any the heap cannot place, get their own memory instead (at most PoolMaxMiB in total, and never
; below LowAddressMiB of free address space). Logged as [physpool] in VCRender.log. 1 = on (default), 0 = off
PhysicalPool=1
PoolLargeMiB=8
PoolMaxMiB=512

[Upscaler]
; Step 259: FSR 3.1 upscaling, run in the 64-bit host. DLSS-IV's game side (plugins\VCRender\dlssiv-client.dll)
; renders the scene at a lower resolution and adds jitter and motion guides; plugins\VCRender\dlssiv-helper-bridge.exe
; upscales it with AMD FSR (the game's DLSSIV folder). Quality and sharpness come from DLSS-IV.cfg beside GTAIV.exe.
; 1 = on, 0 = off (full-resolution rendering as in step 258)
Enabled=1

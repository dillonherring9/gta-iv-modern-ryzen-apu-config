# ============================================================================
#  DLSS-IV
#  REQUIRES DXVK and FusionFix
# ============================================================================


# ============================================================================
#  1.  ANTI-ALIASING AND UPSCALING
# ============================================================================

# upscaler  -  -1 automatic (default): DLSS on NVIDIA RTX cards, XeSS on
# Intel graphics, FSR on all others.  0 DLSS.  1 FSR.  2 XeSS.
upscaler=-1

# fsr_version  -  which FSR version runs. Ignored by DLSS and XeSS.
#
#   0  automatic (default): the newest FSR your graphics card supports
#   4  FSR 4    AMD Radeon RX 6000, 7000 and 9000 series and some Ryzen AI
#               processors (other cards can use it with a custom FSR 4 build)
#   3  FSR 3.1  any graphics card
#
# Automatic gives FSR 4 on cards that support it and FSR 3.1 on
# everything else. FSR 3.1 is generally lighter to run but worse quality.
# Setting 4 on a card without FSR 4 gives you FSR 3.1 instead.
#
# The FSR files in the DLSSIV folder are AMD's FSR SDK 2.4.0, with
# FSR 4.1.2. On a Radeon card, AMD's driver can offer a newer FSR 4, and
# automatic uses it. DLSS-IV.log names the FSR version that ran.
#
# Unofficial community FSR 4 builds can be used by swapping out
# amd_fidelityfx_upscaler_dx12.dll inside the DLSSIV folder.
fsr_version=0

# preset  -  which DLSS model NVIDIA uses. Ignored by FSR and XeSS.
#
#   11  K  the default, best for DLAA and Quality mode
#   13  M  NVIDIA's default for Performance mode
#   12  L  NVIDIA's default for Ultra Performance mode
#   10  J  close to K; but K is recommended instead
#    0      let the driver decide
#
# Leave this alone unless you have a reason. M and L cost more performance
# and use FP8 maths that only RTX 40 and 50 cards have in hardware,
# it will run worse on other cards. Your NVIDIA app setting will overwrite
# this, but it has to be set on dlssiv-helper.exe
preset=11

# quality  -  The internal resolution of the game before upscaling to your
# chosen ingame resolution.
#
#   0  DLAA/Native AA      native resolution, best quality
#   1  Quality             renders at two thirds (67 percent)      (default)
#   2  Balanced            renders at 58 percent
#   3  Performance         renders at a half
#   4  Ultra Performance   renders at a third
#
# XeSS names the same sizes differently: 1 is its Ultra Quality, 3 its
# Balanced.
#
# Quality is the default because it is usually faster than the game without
# the mod. DLAA costs about a quarter of the frame rate when your graphics
# card is the limit, less when it's the CPU. There is no good reason to go
# below Quality in this game if you are on a modern graphics card, because
# GTA IV is held back more by its CPU usage.
quality=1

# custom  -  A custom render size instead of the preset above
# a percent of the ingame resolution, overrides the quality setting above
# valid values:  34 to 99
# 0 disables the custom quality feature
# Needs a restart.
custom=0

# sharpness  -  0 to 1. 0 is off (default); 0.5 is a good place to start.
# Turn your driver's own sharpening off first, or the two stack.
sharpness=0

# responsiveness  -  Faster input response
#
# The mod can cut input delay in three ways:
#
#   Frame queue: stops the game from preparing frames ahead of your graphics
#   card, so your input is not waiting behind old frames. Cheap and safe.
#
#   Pacer: starts each frame only when the graphics card is about to be ready
#   for it, so your input is read later. Helps most when your GPU is maxed out.
#
#   Same-frame upscale: upscales the frame you are on instead of the previous
#   one, which removes a frame of delay. Free with a frame limiter or vsync,
#   but it can cost frame rate without one.
#
#   4  automatic (default), best for most people: the frame queue always,
#      the other two only where the mod measures that they cost no frame rate
#   3  all three, wherever they apply
#   2  frame queue and pacer: for a PC that is always GPU-limited without a
#      frame cap
#   1  frame queue only: the safest choice if anything feels uneven
#   0  off
#
# Needs a restart.
responsiveness=4


# ============================================================================
#  2.  HDR OUTPUT
# ============================================================================

# hdr  -  1 turns HDR on. Switch Windows HDR on before the game starts, set
# the game to Borderless, and run the Windows HDR Calibration app once.
# On Linux: a Steam Deck in Game Mode with HDR on needs nothing more; on a
# desktop add DXVK_HDR=1 and use gamescope --hdr-enabled or Wine's Wayland
# driver.
hdr=0

# hdr_peak  -  how bright your display can actually go, in nits
# 0 uses what Windows reports, which is what the calibration app is for
hdr_peak=0

# hdr_paper_white  -  How bright plain white is, in nits: the HUD, the menus,
# a white wall in daylight. 203 is the standard; 160 to 240 is taste.
hdr_paper_white=203

# hdr_ui  -  brightness of the interface, in nits
# 0 uses the paper white setting
hdr_ui=0

# hdr_rolloff  -  how the very brightest highlights are handled, in percent
# of your display's headroom. Above it, highlights bend gently towards your
# peak instead of clipping flat. 80 is the default; 50 is softer and dimmer
# at the top; 0 clips hard. Leave it at 80 unless bright areas clip.
hdr_rolloff=80

# cfg_live  -  Allows changes to the HDR brightness settings above and to
# sharpness while the game is running (hdr itself needs a relaunch)
#
# OFF by default.
#
#cfg_live=1


# ============================================================================
#  3.  PERFORMANCE
# ============================================================================

# GTA IV is mostly held back by your processor, not your graphics card. These
# settings help with that, and they are why the game can run faster with the
# mod than without it. threaded and unpin are on by default, cpu_place is off.
#
# If the game stutters, set threaded or unpin to 0, one at a time, and restart.

# threaded  -  Moves the game's graphics work onto its own thread, so the game
# does not have to wait for it. This is the mod's largest performance gain.
threaded=1

# unpin  -  GTA IV ties its main thread to your first processor core. This
# frees it, which helps when your processor is the limit. 0 also turns
# cpu_place off.
unpin=1

# cpu_place  -  Gives the busiest threads a processor thread each. Can help
# on a Ryzen with two core groups (5900X, 7950X). If the game stutters with
# it on, set it back to 0.
cpu_place=0

# rename_sdr  -  NVIDIA, SDR only. Lets G-Sync work in a borderless window.
# Set it to 0 if you see ghosting or stutter with G-Sync on.
rename_sdr=1


# ============================================================================
#  4.  FRAME GENERATION
# ============================================================================

# fg  -  1 turns frame generation on. Off by default. Needs a restart.
#
# DLSS-IV's own frame generation, built for GTA IV and tested on screen for
# even pacing. It shows a generated frame between two real frames, so 45 fps
# looks like 90. It works with DLSS, FSR and XeSS, in SDR and HDR.
#
# Turn it on and the mod decides by itself when to use it:
#
# G-Sync or FreeSync: the best fit. It runs when the game is in this range,
# and above it the game is already smooth, so it stays off.
#     120 Hz   38 to 67 fps
#     144 Hz   38 to 80 fps
#     165 Hz   38 to 92 fps
#     240 Hz   38 to 134 fps
#
# Fixed refresh (no G-Sync or FreeSync): turn the game's vsync on. If your
# game cannot reach your refresh rate, it is locked to half of it, and
# generated frames fill the gaps. On a 120 Hz screen, a game running at 85 fps
# is locked to 60 fps and shown as 120. It stays off if the game reaches your
# refresh rate, or cannot even reach half of it.
#     60 Hz    30 fps shown as 60
#     120 Hz   60 fps shown as 120
#     144 Hz   72 fps shown as 144
#
# Leave it off if you want the quickest response: it adds a little input
# delay. Generated frames may also show small visual artifacts in motion. A
# lot of work went into keeping them as small as possible.
#
# Set the game to Borderless. If frame generation does not turn on,
# DLSS-IV-WARNINGS.txt says why.
fg=0

# fg_min_fps  -  Frame generation turns off if the game runs slower than this.
# 0 (default) picks it for you: 38 fps, or 30 fps on a 60 Hz screen.
# Set 30 if your game runs at 30 to 37 fps, or on a fixed 75 Hz screen. You
# may see more artifacts at these rates. Needs a restart.
fg_min_fps=0

name: Build and publish complete major release

on:
  push:
    tags:
      - "v[1-9]"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed." }
          $nsis = Get-ChildItem 'C:\Program Files*\NSIS\makensis.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $nsis) { throw "Chocolatey completed but makensis.exe was not found." }
          $nsis.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build complete installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory -Force -Path installer\build | Out-Null
          $makensis = (Get-Command makensis.exe -ErrorAction Stop).Source
          & $makensis "/DPRODUCT_VERSION=$version" installer\GTAIV_V3_Automatic_Installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed." }
          $installer = "installer\build\GTAIV_After_Dark_Complete_Configuration_v$version.exe"
          if (-not (Test-Path $installer)) { throw "Expected installer was not produced: $installer" }

      - name: Assemble complete, traceable assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $dist = "dist"
          $sourceName = "GTAIV_After_Dark_Source_v$version"
          $packageName = "GTAIV_After_Dark_Complete_Package_v$version"
          $sourceRoot = Join-Path $dist $sourceName
          $packageRoot = Join-Path $dist $packageName
          New-Item -ItemType Directory -Force -Path $sourceRoot, $packageRoot | Out-Null

          Copy-Item .gitignore, README.md, BUILD_ENVIRONMENT.md, RELEASE_NOTES.md -Destination $sourceRoot
          Copy-Item .github, installer, tuned, docs -Destination $sourceRoot -Recurse
          Remove-Item (Join-Path $sourceRoot "installer\build") -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item README.md, RELEASE_NOTES.md -Destination $packageRoot
          Copy-Item docs, tuned -Destination $packageRoot -Recurse
          Copy-Item installer\INSTALLER_PAYLOAD_SHA256SUMS.txt -Destination $packageRoot

          $commit = git rev-parse HEAD
          Set-Content -Path (Join-Path $sourceRoot "SOURCE_COMMIT.txt") -Value $commit -NoNewline
          Set-Content -Path (Join-Path $packageRoot "SOURCE_COMMIT.txt") -Value $commit -NoNewline

          $installer = "installer\build\GTAIV_After_Dark_Complete_Configuration_v$version.exe"
          Copy-Item $installer -Destination $dist
          Compress-Archive -Path $sourceRoot -DestinationPath "$dist\$sourceName.zip" -Force
          Compress-Archive -Path $packageRoot -DestinationPath "$dist\$packageName.zip" -Force

          $assets = Get-ChildItem $dist -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $assets | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)"
          } | Set-Content "$dist\SHA256SUMS.txt"

      - name: Publish or replace complete major release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "dist\GTAIV_After_Dark_Complete_Configuration_v$version.exe",
            "dist\GTAIV_After_Dark_Complete_Package_v$version.zip",
            "dist\GTAIV_After_Dark_Source_v$version.zip",
            "dist\SHA256SUMS.txt"
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Version $version asset replacement failed." }
            gh release edit $tag --title "Version $version — Complete Cumulative Configuration" --notes-file RELEASE_NOTES.md
          } else {
            gh release create $tag $assets --title "Version $version — Complete Cumulative Configuration" --notes-file RELEASE_NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw "Version $version release publication failed." }

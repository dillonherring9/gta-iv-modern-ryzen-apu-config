# GTA IV Complete Edition — Version 3.0.2 stock-DXVK baseline.
# Use this file only with the FusionFix Vulkan route and an upstream-compatible DXVK build.
# Copy it to the GTA IV root as dxvk.conf. Restart after renderer changes and judge repeat runs,
# not a cold shader or pipeline-cache pass.
#
# This profile intentionally contains no GPLAsync-only keys. For the separately verified
# DXVK GPLAsync v2.6.2-1 overlay, see tuned/renderers/dxvk-gplasync-v2.6.2-1.conf.

# Low-latency D3D9 presentation. Test the default value (0) if warm-cache frame pacing regresses.
d3d9.maxFrameLatency = 1

# Keep DXVK's limiter disabled: FusionFix is the only intended frame limiter.
d3d9.maxFrameRate = 0

# Do not override the game's VSync policy.
d3d9.presentInterval = -1

# 32-bit D3D9 memory reporting; this is not reserved or dedicated VRAM.
d3d9.maxAvailableMemory = 4096

# Let DXVK and the driver choose Graphics Pipeline Library support.
dxvk.enableGraphicsPipelineLibrary = Auto

# Preserve fullscreen-exclusive support where the active DXVK build and display path support it.
dxvk.allowFse = true

# The explicit shared-memory-safe value: Auto already limits this optimization to discrete GPUs.
d3d9.deviceLocalConstantBuffers = False

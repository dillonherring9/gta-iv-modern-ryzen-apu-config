# GTA IV After Dark — Version 4 General Modern APU baseline.
#
# Use with the Complete Edition Drag-and-Drop Archive's already working Vulkan route.
# This is the default Version 4 renderer configuration: it uses only upstream-compatible
# DXVK keys and is appropriate when the installed renderer is stock DXVK, DXVK-Sarek,
# another non-GPLAsync build, or simply not yet identified.
#
# Do not use this file to identify or replace vulkan.dll. The archive chooses that binary.
# Read docs/ARCHIVE_RENDERER_IDENTIFICATION.md before changing a working renderer.

# Limit the CPU frame queue for a lower-latency starting point. Test 0 only after
# repeatable warm-cache runs if this setting makes pacing worse on your own system.
d3d9.maxFrameLatency = 1

# FusionFix is the one intended frame limiter. Do not add a second cap casually.
d3d9.maxFrameRate = 0

# Leave VSync ownership to the game/FusionFix policy by default. Use one synchronization
# owner only; the advanced Adrenalin Enhanced Sync route is documented separately.
d3d9.presentInterval = -1

# D3D9 memory-reporting value in MiB; this does not reserve dedicated VRAM.
d3d9.maxAvailableMemory = 4096

# Let the active DXVK build and graphics driver select a supported GPL path.
dxvk.enableGraphicsPipelineLibrary = Auto

# Preserve full-screen-exclusive capability where the active renderer/display supports it.
dxvk.allowFse = true

# Shared-memory-safe baseline: keep device-local constant-buffer streaming disabled.
d3d9.deviceLocalConstantBuffers = False

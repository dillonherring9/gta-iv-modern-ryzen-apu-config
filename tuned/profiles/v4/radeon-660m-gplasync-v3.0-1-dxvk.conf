# GTA IV After Dark — Version 4 Radeon 660M / GPLAsync v3.0-1 overlay.
#
# Choose this profile only when GTAIV_d3d9.log confirms the separate Ph42oN
# DXVK-GPLAsync v3.0-1 artifact is already installed as FusionFix's vulkan.dll route.
# It does not install, update, or validate a renderer DLL for you.
#
# GPLAsync removed dxvk.gplAsyncCache in v2.7-1. Do NOT add that historical key.
# The v3.0-1 README documents dxvk.enableAsync; it does not make the older
# dxvk.numAsyncThreads setting a generic contract, so Version 4 does not install it.

# Shared Radeon 660M / Ryzen 5 PRO 6650U baseline.
d3d9.maxFrameLatency = 1
d3d9.maxFrameRate = 0
d3d9.presentInterval = -1
d3d9.maxAvailableMemory = 4096
dxvk.enableGraphicsPipelineLibrary = Auto
dxvk.allowFse = true
d3d9.deviceLocalConstantBuffers = False

# The only GPLAsync-specific value Version 4 applies for the documented v3.0-1 path.
dxvk.enableAsync = true
